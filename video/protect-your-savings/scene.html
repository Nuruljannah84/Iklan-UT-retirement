<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Protect Your Savings</title>
<style>
  @font-face { font-family: "Kalam"; font-weight: 700; src: url("fonts/Kalam-Bold.ttf"); }
  @font-face { font-family: "Caveat"; font-weight: 400 700; src: url("fonts/Caveat.ttf"); }
  @font-face { font-family: "Montserrat"; font-weight: 100 900; src: url("fonts/Montserrat.ttf"); }
  html, body { margin: 0; padding: 0; background: #fff; }
  svg { display: block; }
  .ink   { fill: none; stroke: #1d1d1f; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  .thin  { stroke-width: 4; }
  .navyS { stroke: #1b2a4a; }
  .goldS { stroke: #c9a227; }
  .head  { font-family: "Kalam"; font-weight: 700; fill: #1b2a4a; text-anchor: middle; }
  .gold  { fill: #c9a227; }
  .label { font-family: "Caveat"; font-weight: 700; fill: #1b2a4a; text-anchor: middle; }
</style>
</head>
<body>
<svg id="svg" xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <radialGradient id="paper" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.75" stop-color="#fbfbf9"/><stop offset="1" stop-color="#eeeeea"/>
    </radialGradient>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="3.2"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <pattern id="coins" width="54" height="40" patternUnits="userSpaceOnUse">
      <ellipse cx="27" cy="20" rx="22" ry="9" fill="none" stroke="#a8861c" stroke-width="3"/>
      <ellipse cx="0" cy="0" rx="22" ry="9" fill="none" stroke="#a8861c" stroke-width="3"/>
      <ellipse cx="54" cy="0" rx="22" ry="9" fill="none" stroke="#a8861c" stroke-width="3"/>
      <ellipse cx="0" cy="40" rx="22" ry="9" fill="none" stroke="#a8861c" stroke-width="3"/>
      <ellipse cx="54" cy="40" rx="22" ry="9" fill="none" stroke="#a8861c" stroke-width="3"/>
    </pattern>
    <linearGradient id="goldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1d97a"/><stop offset="1" stop-color="#d9b445"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6df"/><stop offset="1" stop-color="#f6e7b4"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16264a"/><stop offset="1" stop-color="#22386a"/>
    </linearGradient>
    <!-- jar silhouette (local coords: base centre at 0,0) -->
    <path id="jarBody" d="M-80,-268 L-80,-252 C-80,-236 -120,-232 -120,-205 L-120,-34 C-120,-12 -104,0 -84,0 L84,0 C104,0 120,-12 120,-34 L120,-205 C120,-232 80,-236 80,-252 L80,-268"/>
    <clipPath id="jarInside"><path d="M-74,-262 L-74,-250 C-74,-232 -114,-228 -114,-203 L-114,-36 C-114,-16 -100,-6 -84,-6 L84,-6 C100,-6 114,-16 114,-36 L114,-203 C114,-228 74,-232 74,-250 L74,-262 Z"/></clipPath>
  </defs>

  <rect width="1080" height="1920" fill="url(#paper)"/>
  <g id="world"></g>
  <g id="handLayer"></g>
  <g id="subs"></g>
</svg>

<script>
const NS = "http://www.w3.org/2000/svg";
const INK = "#1d1d1f", NAVY = "#1b2a4a", GOLD = "#c9a227", GOLD_T = "#b08a17", GOLD_L = "#f1d97a", SKIN = "#f4d8c2";
// Actual scene start times (follow the Malay voiceover). Scenes 1-4 were laid out on the design
// timeline D and are stretched/compressed onto T at build time (see warpScenes).
const T = window.TIMING || { s2: 4.60, s3: 9.92, s4: 13.79, s5: 16.59, end: 20, pan: 0.5 };
const D = { s2: 5.95, s3: 10.38, s4: 15.35, s5: 18.75 };
const PHOTO = "../../images/nurul-jannah.webp";

// ---------- helpers ----------
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const easeIO = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeBack = k => { const c = 1.6; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const prog = (t, a, d) => clamp((t - a) / d);

const updaters = []; // custom per-frame animation functions
const items = [];   // drawable things on the timeline
const marks = [];
function mark() { marks.push([items.length, updaters.length]); }
// Map each scene's design window [a, b] onto its real window [na, nb].
function warpScenes(wins) {
  wins.forEach(([a, b, na, nb], i) => {
    const k = (nb - na) / (b - a), [i0, u0] = marks[i], [i1, u1] = marks[i + 1];
    for (let j = i0; j < i1; j++) { items[j].start = na + (items[j].start - a) * k; items[j].dur *= k; }
    for (let j = u0; j < u1; j++) { const f = updaters[j]; updaters[j] = t => f(a + (t - na) / k); }
  });
}

// stroke-drawn paths: several paths drawn one after another in [start, start+dur]
function draw(group, ds, start, dur, cls = "ink", extra = {}) {
  const paths = ds.map(d => el("path", Object.assign({ d, class: cls }, extra), group));
  const lens = paths.map(p => p.getTotalLength());
  const total = lens.reduce((a, b) => a + b, 0);
  paths.forEach((p, i) => { p.style.strokeDasharray = lens[i] + 1; });
  const it = { kind: "path", paths, lens, total, start, dur, hand: true };
  items.push(it);
  return it;
}
// fills that fade in after the outline ("colouring in")
function fill(group, d, color, start, dur = .35, extra = {}) {
  const p = el("path", Object.assign({ d, fill: color, stroke: "none" }, extra), group);
  items.push({ kind: "fade", node: p, start, dur, to: extra.opacity ? +extra.opacity : 1 });
  p.style.opacity = 0;
  return p;
}
function fadeNode(node, start, dur = .35, to = 1) {
  items.push({ kind: "fade", node, start, dur, to }); node.style.opacity = 0; return node;
}
// handwritten text: revealed left-to-right with the hand at the leading edge
let clipId = 0;
function write(group, txt, x, y, size, start, dur, cls = "head", maxW = 920, color) {
  const tx = el("text", { x, y, class: cls, "font-size": size }, group);
  tx.textContent = txt;
  if (color) tx.style.fill = color;
  let w = tx.getComputedTextLength();
  if (w > maxW) { size = size * maxW / w; tx.setAttribute("font-size", size); w = tx.getComputedTextLength(); }
  const id = "c" + (clipId++);
  const cp = el("clipPath", { id }, document.querySelector("defs"));
  const r = el("rect", { x: x - w / 2 - 10, y: y - size * 1.2, width: 0, height: size * 1.7 }, cp);
  tx.setAttribute("clip-path", `url(#${id})`);
  const it = { kind: "text", node: tx, rect: r, x0: x - w / 2 - 10, w: w + 20, y, size, start, dur, hand: true };
  items.push(it);
  return it;
}
function jar(group, cx, by, s) {
  const g = el("g", { transform: `translate(${cx},${by}) scale(${s})` }, group);
  return g;
}

let scenes, art, fills, hand;
function build() {
const world = document.getElementById("world");
scenes = [1, 2, 3, 4, 5].map(i => el("g", { id: "s" + i }, world));
art = scenes.map(s => el("g", { filter: "url(#rough)" }, s)); // sketchy line layer
fills = scenes.map((s, i) => { const g = el("g", {}, s); s.insertBefore(g, art[i]); return g; });

mark();
// ======================= SCENE 1: you build your savings =======================
(function () {
  const t0 = 0.25, A = art[0], F = fills[0];
  write(A, "YOU WORK HARD TO", 540, 330, 84, t0, .95);
  const l2 = write(A, "BUILD YOUR SAVINGS.", 540, 435, 84, t0 + 1.0, 1.0);
  draw(A, ["M250,470 C420,458 640,456 840,466"], t0 + 2.05, .3, "ink goldS", { "stroke-width": 9 });

  // person (professional in hijab + blazer), facing right
  const P = 2.35;
  fill(F, "M180,930 C215,895 212,860 212,790 C212,715 248,680 290,680 C332,680 368,715 368,790 C368,860 365,895 400,930 C330,960 250,960 180,930 Z", "#e9d9a6", P + .9);
  fill(F, "M180,930 C150,950 140,1000 138,1060 L130,1400 L452,1400 L440,1052 C500,1062 540,1052 575,1045 L560,1010 C520,990 460,950 400,930 C330,960 250,960 180,930 Z", NAVY, P + .95, .35, { opacity: .92 });
  fill(F, "M250,785 C250,745 330,745 330,785 C330,830 312,852 290,852 C268,852 250,830 250,785 Z", SKIN, P + .9);
  fill(F, "M560,1010 C590,995 625,1000 640,1015 C650,1030 630,1050 600,1050 C585,1050 578,1047 575,1045 Z", SKIN, P + .95);
  fill(F, "M262,945 L290,1030 L318,945 Z", "#ffffff", P + .95);
  draw(A, [
    "M180,930 C215,895 212,860 212,790 C212,715 248,680 290,680 C332,680 368,715 368,790 C368,860 365,895 400,930",
    "M250,785 C250,745 330,745 330,785 C330,830 312,852 290,852 C268,852 250,830 250,785",
    "M268,795 Q274,788 280,795", "M300,795 Q306,788 312,795", "M277,822 Q290,833 303,822",
    "M180,930 C150,950 140,1000 138,1060 L130,1400",
    "M400,930 C460,950 520,990 560,1010", "M440,1052 C500,1062 540,1052 575,1045", "M440,1052 L452,1400",
    "M560,1010 C590,995 625,1000 640,1015 C650,1030 630,1050 600,1050 C585,1050 578,1047 575,1045",
    "M250,935 L290,1030 L330,935", "M290,1030 L290,1400",
  ], P, .95);

  // jar
  const J = 2.55, jx = 790, jb = 1400, js = 1.15;
  const jf = jar(F, jx, jb, js), ja = jar(A, jx, jb, js);
  fill(jf, "M-80,-268 L-80,-252 C-80,-236 -120,-232 -120,-205 L-120,-34 C-120,-12 -104,0 -84,0 L84,0 C104,0 120,-12 120,-34 L120,-205 C120,-232 80,-236 80,-252 L80,-268 Z", "#eef3fb", J + .7, .35, { opacity: .9 });
  const lvl = el("g", { "clip-path": "url(#jarInside)" }, jf);
  const goldR = el("rect", { x: -130, y: -60, width: 260, height: 80, fill: "url(#goldFill)" }, lvl);
  const patR = el("rect", { x: -130, y: -60, width: 260, height: 80, fill: "url(#coins)" }, lvl);
  fadeNode(lvl, J + .75);
  fill(jf, "M-94,-268 L94,-268 L94,-298 C94,-304 90,-306 84,-306 L-84,-306 C-90,-306 -94,-304 -94,-298 Z", NAVY, J + .75);
  fill(jf, "M-78,-190 L78,-190 L78,-135 L-78,-135 Z", "#ffffff", J + .75);
  draw(ja, [
    "M-80,-268 L-80,-252 C-80,-236 -120,-232 -120,-205 L-120,-34 C-120,-12 -104,0 -84,0 L84,0 C104,0 120,-12 120,-34 L120,-205 C120,-232 80,-236 80,-252 L80,-268",
    "M-94,-268 L94,-268 L94,-298 C94,-304 90,-306 84,-306 L-84,-306 C-90,-306 -94,-304 -94,-298 Z",
    "M-78,-190 L78,-190 L78,-135 L-78,-135 Z",
  ], J, .75);
  draw(ja, ["M-28,-287 L28,-287"], J + .76, .08, "ink", { stroke: "#ffffff", "stroke-width": 7 });
  draw(ja, ["M-100,-185 C-104,-145 -104,-100 -100,-62"], J + .8, .12, "ink thin", { stroke: "#b9c4d6" });
  write(ja, "SAVINGS", 0, -148, 46, J + .85, .45, "label", 150);

  // coins dropping from the hand into the jar, level rises
  const drops = [3.75, 4.35, 4.95];
  const coinG = el("g", {}, scenes[0]);
  drops.forEach((d, i) => {
    const c = el("g", {}, coinG);
    el("ellipse", { cx: 0, cy: 0, rx: 26, ry: 26, fill: GOLD_L, stroke: INK, "stroke-width": 5 }, c);
    el("text", { x: 0, y: 9, "font-family": "Kalam", "font-weight": 700, "font-size": 24, "text-anchor": "middle", fill: "#8a6d12" }, c).textContent = "RM";
    updaters.push(t => {
      const k = prog(t, d, .5);
      c.style.opacity = (t < d - .15 || k >= 1) ? 0 : 1;
      const x = lerp(650, jx, k), y = 1000 - 90 * Math.sin(Math.PI * k) + k * (jb - 287 * js - 1000);
      c.setAttribute("transform", `translate(${x},${y}) rotate(${k * 200}) scale(${1 - .35 * k})`);
    });
  });
  updaters.push(t => {
    let h = 60;
    drops.forEach(d => { h += 45 * easeOut(prog(t, d + .5, .35)); });
    [goldR, patR].forEach(r => { r.setAttribute("y", -h); r.setAttribute("height", h + 20); });
  });
  // question mark above the jar
  const Q = 4.9;
  draw(A, ["M732,770 C730,700 850,690 852,760 C854,815 792,815 792,880"], Q, .45, "ink goldS", { "stroke-width": 16 });
  const dot = el("circle", { cx: 792, cy: 935, r: 12, fill: GOLD }, A);
  fadeNode(dot, Q + .45, .12);
  draw(A, ["M690,720 L668,705", "M700,680 L676,660", "M880,700 L905,685"], Q + .5, .25, "ink thin");
})();

mark();
// ======================= SCENE 2: the reality =======================
(function () {
  const t0 = D.s2 + .3, A = art[1], F = fills[1];
  write(A, "UNEXPECTED RISKS.", 540, 330, 84, t0, .75);
  write(A, "UNEXPECTED COSTS.", 540, 435, 84, t0 + .8, .75, "head", 920, GOLD_T);

  // hospital
  const H = t0 + .35;
  fill(F, "M120,960 L120,660 L480,660 L480,960 Z", "#e7edf6", H + .7);
  fill(F, "M265,960 L265,890 L335,890 L335,960 Z", NAVY, H + .75);
  const winds = [[155, 700], [270, 700], [385, 700], [155, 790], [385, 790], [155, 880], [385, 880]];
  winds.forEach(([x, y]) => fill(F, `M${x},${y} h60 v50 h-60 Z`, "#c4d1e6", H + .75));
  draw(A, ["M120,960 L120,660 L480,660 L480,960", "M98,660 L502,660", "M80,960 L520,960",
    "M265,960 L265,890 L335,890 L335,960",
    ...winds.map(([x, y]) => `M${x},${y} h60 v50 h-60 Z`)], H, .75);
  const sign = el("circle", { cx: 300, cy: 600, r: 44, fill: NAVY }, F); fadeNode(sign, H + .55, .2);
  draw(A, ["M300,556 C325,556 344,575 344,600 C344,625 325,644 300,644 C275,644 256,625 256,600 C256,575 275,556 300,556"], H + .5, .15);
  draw(A, ["M300,578 L300,622", "M278,600 L322,600"], H + .65, .15, "ink goldS", { "stroke-width": 12 });

  // patient in bed
  const B = t0 + 1.1;
  fill(F, "M228,1240 C300,1170 450,1180 545,1240 L545,1300 L228,1300 Z", "#d7e0ef", B + .7);
  fill(F, "M152,1195 C152,1170 172,1155 192,1155 C214,1155 230,1172 230,1195 C230,1218 214,1235 192,1235 C170,1235 152,1218 152,1195 Z", SKIN, B + .7);
  draw(A, [
    "M110,1170 L110,1380", "M110,1300 L565,1300", "M565,1250 L565,1380", "M130,1240 L545,1240",
    "M130,1240 C125,1215 140,1200 160,1205",
    "M152,1195 C152,1170 172,1155 192,1155 C214,1155 230,1172 230,1195 C230,1218 214,1235 192,1235 C170,1235 152,1218 152,1195",
    "M228,1240 C300,1170 450,1180 545,1240",
    "M172,1190 L184,1190", "M200,1190 L212,1190", "M180,1218 Q192,1210 204,1218",
  ], B, .75);
  draw(A, ["M208,1212 L262,1182"], B + .78, .1, "ink thin", { stroke: NAVY });
  draw(A, ["M150,1150 c-6,10 -6,16 0,18 c6,-2 6,-8 0,-18", "M240,1140 l10,-14", "M255,1152 l16,-6"], B + .9, .2, "ink thin goldS");

  // medical bills
  const M = t0 + 1.75;
  const bill = (x, y, r, amt) => {
    const g = el("g", { transform: `translate(${x},${y}) rotate(${r})` }, A);
    const gf = el("g", { transform: `translate(${x},${y}) rotate(${r})` }, F);
    fill(gf, "M-80,-105 L80,-105 L80,105 L-80,105 Z", "#ffffff", M + .3);
    draw(g, ["M-80,-105 L80,-105 L80,105 L-80,105 Z", "M-55,-60 L55,-60", "M-55,-30 L40,-30", "M-55,0 L50,0"], M, .35);
    draw(g, ["M-55,48 L55,48"], M + .35, .08, "ink thin");
    write(g, amt, 0, 88, 40, M + .42, .3, "label", 140, GOLD_T);
    return g;
  };
  bill(660, 790, -8, "RM 18,000");
  bill(800, 840, 7, "RM 9,500");
  const billT = el("text", { x: 660, y: 735, "font-family": "Kalam", "font-weight": 700, "font-size": 34, "text-anchor": "middle", fill: NAVY, transform: "rotate(-8 660 790)" }, A);
  billT.textContent = "BILL"; fadeNode(billT, M + .3, .2);

  // savings jar losing money
  const J = t0 + .9, jx = 820, jb = 1400, js = 1.0;
  const jf = jar(F, jx, jb, js), ja = jar(A, jx, jb, js);
  fill(jf, "M-80,-268 L-80,-252 C-80,-236 -120,-232 -120,-205 L-120,-34 C-120,-12 -104,0 -84,0 L84,0 C104,0 120,-12 120,-34 L120,-205 C120,-232 80,-236 80,-252 L80,-268 Z", "#eef3fb", J + .6, .3, { opacity: .9 });
  const lvl = el("g", { "clip-path": "url(#jarInside)" }, jf);
  const gr = el("rect", { x: -130, width: 260, fill: "url(#goldFill)" }, lvl);
  const pr = el("rect", { x: -130, width: 260, fill: "url(#coins)" }, lvl);
  fadeNode(lvl, J + .6, .3);
  draw(ja, ["M-80,-268 L-80,-252 C-80,-236 -120,-232 -120,-205 L-120,-34 C-120,-12 -104,0 -84,0 L84,0 C104,0 120,-12 120,-34 L120,-205 C120,-232 80,-236 80,-252 L80,-268", "M-90,-268 L90,-268"], J, .6);
  write(ja, "SAVINGS", 0, -135, 42, J + .62, .3, "label", 150);
  const FL = t0 + 2.2;
  updaters.push(t => {
    const h = lerp(215, 55, easeIO(prog(t, FL, 2.0)));
    [gr, pr].forEach(r => { r.setAttribute("y", -h); r.setAttribute("height", h + 20); });
  });
  // flow arrow from jar to hospital/bills, coins travel along it
  const flow = draw(A, ["M770,1110 C700,1060 600,1060 520,960"], FL - .25, .35, "ink goldS", { "stroke-width": 7, "stroke-dasharray": "1 1" });
  draw(A, ["M520,960 L548,968", "M520,960 L522,990"], FL + .1, .1, "ink goldS", { "stroke-width": 7 });
  const fp = flow.paths[0];
  const cg = el("g", {}, scenes[1]);
  for (let i = 0; i < 9; i++) {
    const c = el("g", {}, cg);
    el("ellipse", { cx: 0, cy: 0, rx: 20, ry: 20, fill: GOLD_L, stroke: INK, "stroke-width": 4 }, c);
    el("text", { x: 0, y: 7, "font-family": "Kalam", "font-weight": 700, "font-size": 18, "text-anchor": "middle", fill: "#8a6d12" }, c).textContent = "RM";
    const d0 = FL + i * .24;
    updaters.push(t => {
      const k = prog(t, d0, .75);
      c.style.opacity = (k <= 0 || k >= 1) ? 0 : Math.min(1, (1 - k) * 4, k * 6);
      const L = fp.getTotalLength(), p = fp.getPointAtLength(L * easeIO(k));
      c.setAttribute("transform", `translate(${p.x},${p.y - 18 * Math.sin(Math.PI * k)}) rotate(${k * 300 + i * 40})`);
    });
  }
})();

mark();
// ======================= SCENE 3: financial impact =======================
(function () {
  const t0 = D.s3 + .3, A = art[2], F = fills[2];
  write(A, "ONE EVENT CAN AFFECT", 540, 310, 78, t0, .75);
  write(A, "YOUR ENTIRE", 540, 405, 78, t0 + .78, .45);
  write(A, "FINANCIAL PLAN.", 540, 500, 78, t0 + 1.25, .6, "head", 920, GOLD_T);

  const jars = [[205, "Emergency Fund", .78], [540, "Investment", .7], [875, "Retirement", .74]];
  const J = t0 + .25, base = 1300, s = .95;
  const rects = [];
  jars.forEach(([x, name, lv], i) => {
    const st = J + i * .32;
    const jf = jar(F, x, base, s), ja = jar(A, x, base, s);
    fill(jf, "M-80,-268 L-80,-252 C-80,-236 -120,-232 -120,-205 L-120,-34 C-120,-12 -104,0 -84,0 L84,0 C104,0 120,-12 120,-34 L120,-205 C120,-232 80,-236 80,-252 L80,-268 Z", "#eef3fb", st + .5, .3, { opacity: .9 });
    const lvl = el("g", { "clip-path": "url(#jarInside)" }, jf);
    const gr = el("rect", { x: -130, width: 260, fill: "url(#goldFill)" }, lvl);
    const pr = el("rect", { x: -130, width: 260, fill: "url(#coins)" }, lvl);
    fadeNode(lvl, st + .5, .3);

// ======================= timeline engine =======================
function itemProgress(it, t) { return prog(t, it.start, it.dur); }

function tipOf(it, k) {
  if (it.kind === "path") {
    let L = it.total * k;
    for (let i = 0; i < it.paths.length; i++) {
      if (L <= it.lens[i] || i === it.paths.length - 1) {
        const p = it.paths[i], pt = p.getPointAtLength(Math.min(L, it.lens[i]));
        return toWorld(p, pt.x, pt.y);
      }
      L -= it.lens[i];
    }
  }
  if (it.kind === "text") {
    const x = it.x0 + it.w * k, y = it.y - it.size * .32 + Math.sin(k * it.w / 9) * it.size * .22;
    return toWorld(it.node, x, y);
  }
}
function toWorld(node, x, y) {
  const m = node.getCTM();
  return { x: m.a * x + m.c * y + m.e, y: m.b * x + m.d * y + m.f };
}

function sceneTransforms(t) {
  const starts = [0, T.s2, T.s3, T.s4, T.s5];
  scenes.forEach((g, i) => {
    const s = starts[i], next = starts[i + 1];
    let x = 0;
    if (i > 0) x = 1080 * (1 - easeIO(prog(t, s, T.pan)));
    if (next !== undefined) x -= 1080 * easeIO(prog(t, next, T.pan));
    const visible = t >= s - .01 && (next === undefined || t < next + T.pan + .01);
    g.style.display = visible ? "" : "none";
    const end = next === undefined ? T.end : next + T.pan;
    const z = 1 + .035 * prog(t, s, end - s);           // slow push-in
    g.setAttribute("transform", `translate(${x},0) translate(540,960) scale(${z}) translate(-540,-960)`);
  });
}

const REST = { x: 1180, y: 2150 };
function render(t) {
  sceneTransforms(t);
  for (const it of items) {
    const k = itemProgress(it, t);
    if (it.kind === "path") {
      let L = it.total * k;
      it.paths.forEach((p, i) => {
        const d = clamp(L, 0, it.lens[i]); L -= it.lens[i];
        p.style.strokeDashoffset = it.lens[i] + 1 - d;
        p.style.visibility = d > 0 ? "visible" : "hidden";
      });
    } else if (it.kind === "text") {
      it.rect.setAttribute("width", it.w * k);
    } else if (it.kind === "fade") {
      it.node.style.opacity = it.to * k;
    }
  }
  updaters.forEach(f => f(t));

  // hand position
  const drawn = items.filter(it => it.hand).sort((a, b) => a.start - b.start);
  let pos = null;
  const active = drawn.filter(it => t >= it.start && t < it.start + it.dur);
  if (active.length) {
    const it = active[active.length - 1];
    pos = tipOf(it, itemProgress(it, t));
  } else {
    const prev = drawn.filter(it => it.start + it.dur <= t).pop();
    const next = drawn.find(it => it.start > t);
    const pEnd = prev && prev.start + prev.dur, nSt = next && next.start;
    const from = prev ? tipOf(prev, 1) : REST, to = next ? tipOf(next, 0) : REST;
    if (prev && next && nSt - pEnd < .9) {
      const k = easeIO((t - pEnd) / (nSt - pEnd));
      pos = { x: lerp(from.x, to.x, k), y: lerp(from.y, to.y, k) - 40 * Math.sin(Math.PI * k) };
    } else {
      const out = prev ? prog(t, pEnd, .45) : 1, inn = next ? 1 - prog(t, nSt - .45, .45) : 1;
      if (prev && out < 1) pos = { x: lerp(from.x, REST.x, easeIO(out)), y: lerp(from.y, REST.y, easeIO(out)) };
      else if (next && inn < 1) pos = { x: lerp(REST.x, to.x, easeIO(1 - inn)), y: lerp(REST.y, to.y, easeIO(1 - inn)) };
      else pos = REST;
    }
  }
  hand.setAttribute("transform", `translate(${pos.x},${pos.y})`);
}
